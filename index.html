<body>
<canvas id="c" tabindex="0" aria-label="Zone de jeu Mini Royale"></canvas><canvas id="c3" tabindex="0" aria-label="Rendu 3D Mini Royale"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="hud"><div class="chip">👥 <b id="alive">12</b></div><div class="chip">🎯 <b id="kills">0</b></div><div class="chip">🪵 <b id="mats">60</b></div><div class="chip" id="spchip"></div></div>
<div id="toast" class="chip"></div><div id="bars"><div id="hint"></div><div id="inv"></div><div class="bar"><i id="sh" style="background:var(--sh)"></i></div><div class="bar"><i id="hp" style="background:var(--hp)"></i></div></div>
<div id="codebox" class="chip"></div><div id="ov"><div class="card">
<h1>Mini Royale</h1>
<div class="xp"><i id="xpbar"></i></div><div style="font-size:13px"><span id="sname">Saison 1 : Aurores</span> · <span id="tier"></span></div>
<div class="tabs" id="tabs"><button data-tab="play">⚔ Jouer</button><button data-tab="locker">🎒 Casier</button><button data-tab="pass">🏆 Pass</button><button data-tab="friends">👥 Amis</button></div>
<div id="pane"></div>
<button id="go">Jouer</button>
<small>Jeu original fait avec Claude, sans lien avec Fortnite ni Epic Games.</small>
</div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const WORLD=12800,CELL=40,N=320,MID=6400;
const RAR=[['Commun','#e4e4e4',1],['Rare','#3b9cff',1.2],['Épique','#b050ff',1.45],['Légendaire','#ff9b1f',1.75],['Mythique','#ffe23a',2.1],['Exotique','#2de2d0',2.5]];
const WP={pi:{n:'Pistolet',d:14,cd:.35,sp:700,sg:.05,p:1,life:1},ar:{n:'Fusil d’assaut',d:17,cd:.13,sp:760,sg:.08,p:1,life:1.1},sg:{n:'Fusil à pompe',d:10,cd:.85,sp:650,sg:.28,p:6,life:.35},rl:{n:'Lance-roquettes',d:36,cd:1.1,sp:700,sg:.1,p:1,life:1.3,boom:200},gl:{n:'Lance-grenades',d:24,cd:1.1,sp:720,sg:.14,p:1,life:1.2,boom:140},sn:{n:'Sniper',d:52,cd:1.25,sp:980,sg:.03,p:1,life:1.5},sx:{n:'Arme exotique',d:18,cd:.18,sp:820,sg:.12,p:3,life:1.1},se:{n:'Fusil à énergie',d:22,cd:.16,sp:880,sg:.08,p:2,life:1.1},s:{n:'Power',d:40,cd:0,sp:420,sg:0,p:1,life:1},w:{n:'Pistolet',d:0,cd:0,sp:0,sg:0,p:0,life:0}};
const SPR=[['Klombo','🦖','Crée du butin à chaque niveau (monte en te soignant)','dino',0x4cc35a],['Quack','🦆','Partage 50 % de son XP avec tes autres esprits','duck',0xffd23a],['Jackrabbit','🐇','Fait gagner 8 % de plus d’XP par élimination','rabbit',0xff708d],['Bot','🤖','Laisse des logiciels de guerre à tes côtés','robot',0x4ecbff],['Shield','🛡️','Réduit les dégâts de 10 %','shield',0x7da7ff],['Onigiri','🍙','Restaure un peu de santé à chaque victoire','onigiri',0xffd26a],['Crown','👑','Boost de rareté et chance d’objets légendaires','crown',0xf7d94c],['Cake','🎂','Dons aléatoires après les succès','cake',0xff8fc7],['Mimic','🪄','Faux rename pixel', 'mimic', 0xc8b6ff]];
const VAR=[['Normal','#ffffff','Pouvoir de base'],['Doré','#ffd24a','XP des éliminations ×3'],['Cheat Master','#a855f7','Tous les codes sont réussis'],['Loot Hacker','#22c55e','20 % de chance supplémentaire de butin rare'],['Rogue','#f87171','Les bonus de survie sont doublés']];
const ALLC=SPR.flatMap((o,i)=>VAR.map((q,v)=>i+':'+v));
const SK=[{n:'Classique',c:'#3b82f6',a:'#1e3a8a',t:0},{n:'Rouge',c:'#dc2626',a:'#450a0a',t:1},{n:'Ninja',c:'#262626',a:'#e11d48',t:4},{n:'Astro',c:'#e8e8f0',a:'#38bdf8',t:7},{n:'Doré',c:'#e6b422',a:'#7c5a00',t:2},{n:'Futuriste',c:'#1f2937',a:'#22d3ee',t:9},{n:'Forêt',c:'#0f766e',a:'#84cc16',t:6},{n:'Neon',c:'#a855f7',a:'#ec4899',t:3},{n:'Arc-en-ciel',c:'#f0abfc',a:'#60a5fa',t:10}];
const PK=[{n:'Pioche de base',c:'#9ca3af',t:0},{n:'Pioche Cuivre',c:'#c2703d',t:2},{n:'Pioche Or',c:'#facc15',t:5},{n:'Pioche Cristal',c:'#67e8f9',t:8},{n:'Pioche Cyber',c:'#f0abfc',t:11},{n:'Pioche Obsidienne',c:'#b91c1c',t:14},{n:'Pioche Légende',c:'#f472b6',t:17}];
const PT=[{n:'Aucun',e:'',t:0},{n:'Poussin',e:'🐥',t:3},{n:'Renardeau',e:'🦊',t:6},{n:'Slime',e:'🟢',t:9},{n:'Dragonnet',e:'🐲',t:12},{n:'Klombo miniature',e:'🦕',t:5},{n:'Loup des neiges',e:'🐺',t:15},{n:'Bébé panda',e:'🐼',t:18}];
let SV={xp:0,sk:0,pk:0,pt:0,es:'0:0',col:['0:0','1:0'],sx:{},ext:{},fr:[]};
try{Object.assign(SV,JSON.parse(localStorage.getItem('mr2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('mr2',JSON.stringify(SV))}catch(e){}};

let W=0,H=0,walls,houses,bullets,parts,fx,loot,player,bots,pet,t,kills,running=false,last=0,buildCd=0,aim=false,mapOpen=false,tt=0,inj=[],chests=[],code=null;
const mouse={x:0,y:0,down:false},keys={};
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);

const rnd=n=>Math.random()*n|0;
function rollR(){const f=()=>{let r=Math.random()*100,s=0;for(let i=0;i<6;i++){s+=[40,26,16,10,5,3][i];if(r<s)return i}return 0};return f()}
function overlaps(x,y,r){for(let gy=Math.floor((y-r)/CELL);gy<=Math.floor((y+r)/CELL);gy++)for(let gx=Math.floor((x-r)/CELL);gx<=Math.floor((x+r)/CELL);gx++)if(walls.has(gy*N+gx))return true;return false}
function circleRect(e,gx,gy,pad){const cx=Math.max(gx*CELL,Math.min(e.x,gx*CELL+CELL)),cy=Math.max(gy*CELL,Math.min(e.y,gy*CELL+CELL));return Math.hypot(e.x-cx,e.y-cy)<e.r+(pad||0)}
function mk(bot,x,y){const s=bot?{c:'hsl('+rnd(360)+',65%,50%)',a:'hsl('+rnd(360)+',40%,20%)'}:SK[SV.sk];const pk=bot?'#9ca3af':PK[SV.pk].c;
  return{x,y,r:14,hp:bot?80:100,sh:0,ang:0,cd:0,bot,dead:false,hit:0,st:0,sd:1,sl:[null,null,null,null],cur:0,pot:0,kit:0,mats:60,c:s.c,a:s.a,pk}}
function spawn(avoid){for(let i=0;i<300;i++){const x=80+Math.random()*(WORLD-160),y=80+Math.random()*(WORLD-160);if(overlaps(x,y,24))continue;if(avoid&&Math.hypot(x-avoid.x,y-avoid.y)<700)continue;return{x,y}}return{x:WORLD/2,y:WORLD/2}}
function drop(x,y,o){loot.push(Object.assign({x,y},o))}
function randLoot(x,y){const q=Math.random();if(q<.2)drop(x,y,{k:'pot'});else if(q<.35)drop(x,y,{k:'kit'});else drop(x,y,{k:'w',w:['pi','ar','ar','sg','sg','rl','gl','sn','sx','se'][rnd(10)],r:rollR()})}

function init(){
  walls=new Map();houses=[];towns=Array.from({length:18},()=>({x:700+Math.random()*(WORLD-1400),y:700+Math.random()*(WORLD-1400)}));bullets=[];parts=[];fx=[];loot=[];chests=[];kills=0;t=0;mapOpen=false;
  for(let i=0,tries=0;i<420&&tries<6000;tries++){
    const roll=Math.random(),kind=roll<.055?'skyscraper':roll<.25?'apartment':roll<.39?'cabin':'house';
    const w=kind==='skyscraper'?9+rnd(5):5+rnd(4),h=kind==='skyscraper'?9+rnd(5):5+rnd(4),hp=hpos(w,h),gx=hp[0],gy=hp[1];
    if(houses.some(o=>gx<o.gx+o.w+2&&gx+w+2>o.gx&&gy<o.gy+o.h+2&&gy+h+2>o.gy))continue;
    const door=rnd(4),style=rnd(5),floors=kind==='skyscraper'?5+rnd(4):kind==='apartment'?2:(Math.random()<.28?2:1);houses.push({gx,gy,w,h,door,doorOpen:false,style,kind,floors});i++;
    for(let x=0;x<w;x++)for(let y=0;y<h;y++){
      if(!(x==0||y==0||x==w-1||y==h-1))continue;
      if((door==0&&y==0&&x==(w>>1))||(door==1&&y==h-1&&x==(w>>1))||(door==2&&x==0&&y==(h>>1))||(door==3&&x==w-1&&y==(h>>1)))continue;
      walls.set((gy+y)*N+gx+x,{hp:70,max:70,own:false});
    }
    chests.push({x:(gx+1+rnd(w-2))*CELL+20,y:(gy+2+rnd(h-3))*CELL+20,open:false});

troke();ctx.restore();drawMap(10,50,150);$('alive').textContent=bots.filter(b=>!b.dead).length+(player.dead?0:1)+Math.min(3,Array.isArray(SV.fr)?SV.fr.length:0);$('kills').textContent=kills;$('mats').textContent=Math.floor(player.mats);$('hp').style.width=Math.max(0,player.hp)+'%';$('sh').style.width=player.sh*2+'%';$('spchip').textContent=player.spr.map(q=>SPR[q.s][1]+' Nv '+Math.min(5,Math.floor(q.xp/2))).join('  ');const o=running?near():null,jn=running?injNear():null,cn=running?chestNear():null,dg=running?doorNear():null;$('hint').textContent=code?'':dg?'E : ouvrir / fermer la porte':cn?'E : ouvrir le coffre':jn?'E : activer le code':o?'E : ramasser': 'Reste dans la zone';const sl=$('inv').children;for(let i=0;i<4;i++){const w=player.sl[i];slot(sl[i],i+1,w?'w'+w.w+w.r:'',()=>'<img src="'+iconURL('w',w.w,RAR[w.r][1])+'" width=48 height=30 title="'+WP[w.w].n+'"><br>'+WP[w.w].n)}slot(sl[4],5,'p'+player.pot,()=>'<img src="'+iconURL('pot','','#2f8cff')+'" width=48 height=30><br>×'+player.pot);slot(sl[5],6,'k'+player.kit,()=>'<img src="'+iconURL('kit','','#ff4040')+'" width=48 height=30><br>×'+player.kit)}
let qualityScale=1,qualityFrames=0,qualityTime=0;
function frame(ts){requestAnimationFrame(frame);const raw=(ts-last)/1000||0,dt=Math.min(.033,raw);last=ts;if(running)update(dt);draw();}
function setMouse(e){const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top}
cv.addEventListener('pointermove',setMouse);
cv.addEventListener('mousedown',e=>{setMouse(e);try{cv.focus({preventScroll:true})}catch(_){cv.focus()}if(e.button===2)aim=true;if(e.button===0)mouse.down=true});
addEventListener('mouseup',e=>{if(e.button===2)aim=false;if(e.button===0)mouse.down=false});
addEventListener('pointercancel',()=>{mouse.down=false;aim=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(running){e.preventDefault();cycle(e.deltaY>0?1:-1)}},{passive:false});
function setGameKey(e,down){const k=(e.key||'').toLowerCase();if(k)keys[k]=down;const physical={KeyW:'w',KeyZ:'z',KeyS:'s',KeyA:'a',KeyQ:'q',KeyD:'d',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright'}[e.code];if(physical)keys[physical]=down;}
addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();setGameKey(e,true);if(!running)return;const moveKey=['KeyW','KeyZ','KeyS','KeyA','KeyQ','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code);if(moveKey||k===' ')e.preventDefault();if(code){if(!e.repeat)codeKey(k);e.preventDefault();return}if(e.repeat)return;if(k=='e'){const a=injNear();if(a){startCode(a);return}const c=chestNear();if(c){openChest(c);return}const d=doorNear();if(d){d.userData.open = !d.userData.open; d.rotation.y = d.userData.open ? Math.PI / 2 : 0;}}});
addEventListener('keyup',e=>{setGameKey(e,false);if((e.key||'').toLowerCase()==='e')keys.revive=false});
addEventListener('blur',()=>{for(const k of Object.keys(keys))keys[k]=false;mouse.down=false;aim=false});
function chestNear(){return chests.find(q=>!q.open&&Math.hypot(q.x-player.x,q.y-player.y)<60)}
function openChest(c){c.open=true;sprXP(1);const n=1+rnd(3);for(let i=0;i<n;i++){const a=i*2.1+Math.random();drop(c.x+Math.cos(a)*30,c.y+Math.sin(a)*30,{k:'s',s:rnd(SPR.length),v:rnd(5)})}}
function doorNear(){let best=null,bd=68;for(const h of houses){const x=(h.gx+h.w/2)*CELL,y=(h.gy+h.h/2)*CELL;const d=Math.hypot(player.x-x,player.y-y);if(d<bd){best=h;bd=d}}return best}
function slot(el,n,key,html){if(el.dataset.k===key)return;el.dataset.k=key;el.innerHTML=n+'<br>'+(key?html():'—')}
const icache={};
function iconURL(k,id,c){const key=k+id+c;if(icache[key])return icache[key];return ''}
let tab='play';
const passMonthNames=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function currentPass(){const d=new Date();const m=d.getMonth();const seasonNames=['Givre royal','Éclipse mystique','Néons de combat','Jardin sauvage','Flammes anciennes','Aurores cosmiques','Tempête dorée','Glacier lunaire'];return {label:seasonNames[m%seasonNames.length],title:passMonthNames[m]}};
function lobby(){const pass=currentPass();const tier=Math.min(12,Math.floor(SV.xp/100));$('xpbar').style.width=(tier>=12?100:SV.xp%100)+'%';$('sname').textContent='Pass '+pass.label+' · '+pass.title;$('tier').textContent='Palier '+tier;for(const b of $('tabs').children)b.classList.toggle('sel',b.dataset.tab==tab);let h='';if(tab=='play')h='<div class="lobby-hero"><section class="lobby-main"><div class="lobby-kicker">Mini Royale · Île de combat</div><h2>'+(msg?'Résultats de la partie':'Prêt à sauter dans la zone')+'</h2><p>'+(msg||'Rassemble ton butin, évite la tempête et termine en tant que dernier survivant.')+'</p><div class="lobby-pills"><span class="lobby-pill">Mode solo</span><span class="lobby-pill">Storm rapide</span><span class="lobby-pill">Bâtiment stratégique</span></div></section><aside class="party-panel"><div class="party-title"><span>Équipe</span><span class="party-state">3 en ligne</span></div><div class="party-slot"><div class="party-avatar">🧍</div><div><strong>Toi</strong><small>Chef d’équipe</small></div></div><div class="party-slot"><div class="party-avatar">🧍</div><div><strong>Ami 1</strong><small>Prêt</small></div></div><div class="party-slot"><div class="party-avatar">🧍</div><div><strong>Ami 2</strong><small>Vérifié</small></div></div><div class="party-actions"><button id="inviteBtn">Inviter</button><button id="readyBtn">Prêt</button></div></aside></div><div class="lobby-section-title"><span>Fonctionnalités</span></div><div class="feature-grid"><div class="feature-card"><b>Butin</b><span>Armes, potions, kits et esprits de départ.</span></div><div class="feature-card"><b>Tempête</b><span>Zone de dégâts qui réduit la carte au fil du temps.</span></div><div class="feature-card"><b>Construction</b><span>Crée des murs rapides pour sécuriser ton point de vue.</span></div></div>';if(tab=='pass'){h='<h3>Pass du mois</h3><div class="row got"><span>Vague actuelle</span><span>'+pass.label+'</span></div><div class="row"><span>XP total</span><span>'+SV.xp+'</span></div><div class="row"><span>Palier</span><span>'+tier+'/12</span></div><div class="row"><span>Récompenses</span><span>3 nouveaux skins</span></div>';}if(tab=='locker'){h='<h3>Skins</h3><div class="chips">'+SK.map((o,i)=>'<button data-key="sk" data-val="'+i+'"'+(SV.sk==i?' class="sel"':'')+'>'+o.n+'</button>').join('')+'</div><h3>Pioche</h3><div class="chips">'+PK.map((o,i)=>'<button data-key="pk" data-val="'+i+'"'+(SV.pk==i?' class="sel"':'')+'>'+o.n+'</button>').join('')+'</div><h3>Compagnon</h3><div class="chips">'+PT.map((o,i)=>'<button data-key="pt" data-val="'+i+'"'+(SV.pt==i?' class="sel"':'')+'>'+o.e+' '+o.n+'</button>').join('')+'</div>';}if(tab=='friends'){h='<h3>Ton code ami</h3><div class="chips"><button disabled>'+SV.id+'</button><button data-act="copy">Copier le lien d’invitation</button></div><h3>Ajouter un ami</h3><div class="chips"><input id="fname" maxlength="24" placeholder="Nom de l’ami" /><button data-act="add">Ajouter</button></div>';}$('pane').innerHTML=h;}
$('tabs').addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;lobby()}});
$('pane').addEventListener('click',e=>{const d=e.target.dataset;if(d.tab){tab=d.tab;lobby();return};if(d.act=='copy'){try{navigator.clipboard.writeText(location.href);toast('Lien copié')}catch(e){toast('Copie impossible')}};if(d.act=='add'){const v=$('fname').value.trim().slice(0,24);if(v&&SV.fr.length<30&&!SV.fr.includes(v)){SV.fr.push(v);save();lobby()}};if(d.key){const k=d.key,v=Number(d.val);if(k=='sk')SV.sk=v;if(k=='pk')SV.pk=v;if(k=='pt')SV.pt=v;save();lobby()}});
$('go').addEventListener('click',()=>{init();running=true;$('ov').classList.add('off')});
for(let i=0;i<6;i++){const d=document.createElement('div');d.className='sl';$('inv').appendChild(d)}
resize();init();lobby();requestAnimationFrame(frame);
let tto;function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tto);tto=setTimeout(()=>e.style.display='none',3800)}
function extract(p){const k=p.s+':'+p.v;SV.sx[k]=0;SV.ext[k]=(SV.ext[k]||0)+1;SV.xp=Math.min(1200,SV.xp+100);player.spr.splice(player.spr.indexOf(p),1);toast('✨ '+SPR[p.s][0]+(p.v?' '+VAR[p.v][0]:'')+' extrait');save();}
function getSprite(s,v){const k=s+':'+v;if(!SV.col.includes(k)){SV.col.push(k);save()}if(player.spr.length>=3)player.spr.shift();player.spr.push({s,v,xp:SV.sx[k]||0})}
function aimAng(){return Math.atan2(mouse.y-H/2,mouse.x-W/2)}
</script>
